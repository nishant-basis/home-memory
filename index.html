<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HOME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, #241d19 0%, #0b0d0f 48%, #050607 100%);
      color: #f4eee5;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .opening {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 30px;
    }

    .content {
      max-width: 700px;
      animation: appear 2.5s ease forwards;
    }

    .small-line {
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #b8aa9b;
      margin-bottom: 35px;
      opacity: 0.8;
    }

    h1 {
      font-size: clamp(70px, 12vw, 145px);
      font-weight: 400;
      letter-spacing: 12px;
      line-height: 1;
      margin-bottom: 28px;
    }

    .subtitle {
      font-size: clamp(16px, 2vw, 22px);
      font-style: italic;
      color: #c9beb2;
      line-height: 1.7;
      margin-bottom: 50px;
    }

    .enter {
      display: inline-block;
      padding: 15px 38px;
      border: 1px solid rgba(220, 205, 190, 0.45);
      border-radius: 2px;
      color: #eee5da;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: all 0.5s ease;
      cursor: pointer;
      background: transparent;
    }

    .enter:hover {
      background: #eee5da;
      color: #171311;
      border-color: #eee5da;
      transform: translateY(-2px);
    }

    .line {
      width: 70px;
      height: 1px;
      background: #806b59;
      margin: 0 auto 35px;
      opacity: 0.7;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 3px;
      color: #756960;
      text-transform: uppercase;
    }

    .heart {
      position: absolute;
      font-size: 13px;
      color: #a77b6a;
      opacity: 0.7;
      animation: pulse 4s infinite ease-in-out;
    }

    .heart.one {
      top: 25%;
      left: 15%;
    }

    .heart.two {
      top: 65%;
      right: 16%;
      animation-delay: 1.5s;
    }

    .heart.three {
      top: 18%;
      right: 25%;
      animation-delay: 3s;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.25;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.3);
      }
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: 7px;
      }

      .small-line {
        letter-spacing: 3px;
      }

      .subtitle {
        max-width: 330px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>

<body>

  <main class="opening">

    <span class="heart one">♡</span>
    <span class="heart two">♡</span>
    <span class="heart three">♡</span>

    <div class="content">

      <div class="small-line">
        A place for everything we remember
      </div>

      <div class="line"></div>

      <h1>HOME</h1>

      <p class="subtitle">
        Some memories are not meant to be kept in photographs.<br>
        Some are meant to be kept somewhere you can return to.
      </p>

      <button class="enter" onclick="enterHome()">
        Enter
      </button>

    </div>

    <div class="footer">
      Made of memories · Built one moment at a time
    </div>

  </main>

  <script>
    function enterHome() {
      alert("Our HOME is being built. ❤️");
    }
  </script>

</body>
</html>
